# castlDDL configuration.
#
# Each research direction selects venues from ccfddl
# (https://github.com/ccfddl/ccf-deadlines/tree/main/conference):
#   subs:   every venue in a ccfddl category (DB, DS, SC, ...)
#   venues: single venues, written as <category>/<file name without .yml>
# `short` and `short_zh` label the filter buttons on the site.
# A venue can belong to more than one direction. The first direction that
# lists a venue sets its color on the site.
#
# Venues that ccfddl does not have go in extra.yml.
# After you change this file, the GitHub Action rebuilds the site.

repo: https://github.com/CarsonOvO/castlDDL

# Editions older than this many years before the current year are dropped.
years_back: 1

directions:
  - id: db
    short: Databases & big data
    short_zh: 数据库与大数据
    name: Database systems, big data analytics and social networks
    name_zh: 数据库、大数据分析与社交网络
    subs: [DB]
    venues: [MX/bigdata, MX/www, MX/sigspatial, HI/icwsm]

  - id: cloud
